<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペア決めルーレット</title>
<style>
:root{--bg:#f5f3ff;--ink:#25213a;--accent:#6d5ce8;--card:#fff;--muted:#77718d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(160deg,#f5f3ff,#e8f7ff);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:22px}
main{width:min(620px,100%);margin:auto}.hero{text-align:center;padding:18px 8px 10px}.wheel{width:128px;height:128px;border-radius:50%;margin:0 auto 14px;background:conic-gradient(#ffcc66 0 45deg,#ff8d9e 45deg 90deg,#8cddca 90deg 135deg,#8db8ff 135deg 180deg,#c8a5ff 180deg 225deg,#ffe28a 225deg 270deg,#91e2e8 270deg 315deg,#f7a7d5 315deg);border:8px solid white;box-shadow:0 8px 24px #4b438526;position:relative;display:grid;place-items:center;transition:transform 1.1s cubic-bezier(.15,.75,.2,1)}.wheel:after{content:"";position:absolute;top:-16px;left:calc(50% - 11px);border-left:11px solid transparent;border-right:11px solid transparent;border-top:0;border-bottom:22px solid #332c56}.wheel span{background:#fff;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-size:25px}h1{margin:8px 0;font-size:clamp(25px,6vw,34px)}p{color:var(--muted);margin:6px 0}.panel{background:#ffffffd9;border:1px solid #ffffff;border-radius:22px;padding:18px;box-shadow:0 12px 35px #42356b12;margin-top:14px}.status{text-align:center;font-weight:700;font-size:18px;margin:5px 0 14px}.pair{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #e9e5ff;border-radius:16px;padding:14px;margin:10px 0;animation:pop .25s ease}.pair strong{font-size:19px}.pair .num{color:var(--accent);font-weight:800;white-space:nowrap}.vs{color:#aaa;margin:0 8px}button{border:0;border-radius:15px;padding:15px 18px;font-size:17px;font-weight:750;cursor:pointer;width:100%;background:var(--accent);color:#fff;box-shadow:0 5px 0 #5142bf;transition:transform .1s}button:active{transform:translateY(3px);box-shadow:0 2px 0 #5142bf}button:disabled{opacity:.6;cursor:wait}.secondary{margin-top:10px;background:#fff;color:var(--accent);box-shadow:0 0 0 1px #d9d3ff inset}.remaining{text-align:center;font-size:14px;color:var(--muted);line-height:1.8;margin:12px 0 2px}.hidden{display:none}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}footer{text-align:center;color:#8b86a0;font-size:12px;margin:18px}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="wheel" id="wheel"><span>🎲</span></div>
    <h1>ペア決めルーレット</h1>
    <p>ルーレットを回して、1ペアずつ発表！</p>
  </header>
  <section class="panel">
    <div class="status" id="status">準備はいい？</div>
    <div id="results"></div>
    <div id="remaining" class="remaining">参加者：るな・いと・もえか・ゆうたろう・はるま・はる・ひろあき・大学生</div>
    <button id="spin">ルーレットスタート！</button>
    <button id="reset" class="secondary hidden">最初からやり直す</button>
  </section>
  <footer>全8人・4ペア</footer>
</main>
<script>
const allPeople = ["るな","いと","もえか","ゆうたろう","はるま","はる","ひろあき","大学生"];
let remaining = [...allPeople], pairs = [], busy = false;
const $ = id => document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){
  $("results").innerHTML = pairs.map((p,i)=>`<div class="pair"><span class="num">第${i+1}ペア</span><strong>${p[0]} <span class="vs">×</span> ${p[1]}</strong></div>`).join("");
  $("remaining").textContent = remaining.length ? "残り：" + remaining.join("・") : "全員のペアが決まりました！";
  $("spin").classList.toggle("hidden", pairs.length===4);
  $("reset").classList.toggle("hidden", pairs.length!==4);
  $("spin").textContent = pairs.length===0 ? "ルーレットスタート！" : `第${pairs.length+1}ペアを決める！`;
  $("status").textContent = pairs.length===4 ? "ペア決定！" : pairs.length===0 ? "準備はいい？" : `現在 ${pairs.length}/4 ペア決定`;
}
$("spin").addEventListener("click",()=>{
  if(busy || pairs.length>=4) return;
  busy=true; $("spin").disabled=true;
  const wheel=$("wheel");
  wheel.style.transform=`rotate(${1080+Math.floor(Math.random()*720)}deg)`;
  $("status").textContent="抽選中…";
  setTimeout(()=>{
    // Select two at random. If either special person is selected, pair them together.
    let pool=[...remaining], pair;
    const hasLuna=pool.includes("るな"), hasHaruma=pool.includes("はるま");
    // Randomly select a person first. If it's one member of the required pair,
    // their partner is selected automatically; otherwise choose a random second person.
    const firstIndex=Math.floor(Math.random()*pool.length);
    const first=pool.splice(firstIndex,1)[0];
    let second;
    if(first==="るな") second="はるま";
    else if(first==="はるま") second="るな";
    else {
      // If both special members remain, prevent splitting them across different pairs.
      // They remain together until a random turn selects either one.
      const eligible=pool.filter(n => !(hasLuna && hasHaruma && (n==="るな" || n==="はるま")));
      // Other names are chosen normally; the special pair will be selected on a later turn.
      // This avoids revealing any special label in the UI.
      const candidates=eligible.length ? eligible : pool;
      second=candidates[Math.floor(Math.random()*candidates.length)];
    }
    pair=[first,second];
    // If first was an ordinary person and second ordinary, remove both.
    remaining=remaining.filter(n=>n!==pair[0] && n!==pair[1]);
    // When only the special pair remains, they naturally form the last pair.
    pairs.push(pair);
    render(); busy=false; $("spin").disabled=false;
  },1150);
});
$("reset").addEventListener("click",()=>{
  remaining=[...allPeople];pairs=[];busy=false;
  $("wheel").style.transform="rotate(0deg)";
  $("spin").disabled=false;render();
});
render();
</script>
</body>
</html>
